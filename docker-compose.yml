version: '3.8'

services:
  flask-app:
    profiles: ["frontend"]
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flask
    ports:
      - "5001:5000"
    volumes:
      - ./app:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SPARK_URL=http://spark-master:8080  # Corrigido: spark → spark-master
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]
    networks:
      - spark-network

  spark-master:
    profiles: ["backend"] 
    build:
      context: ./spark
    container_name: spark-master 
    ports:
      - "8080:8080"  #Site
      - "7077:7077"  #spark
    volumes:
      - ./spark:/opt/spark/work-dir
    command: ["/bin/bash", "-c", "/opt/spark/start-master.sh"]
    networks:
      - spark-network  

  spark-worker-1:
    profiles: ["backend"]
    build:
      context: ./spark
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: ["/bin/bash", "-c", "/opt/spark/start-worker.sh"]
    networks:
      - spark-network

  spark-worker-2:  
    profiles: ["backend"]
    build:
      context: ./spark
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: ["/bin/bash", "-c", "/opt/spark/start-worker.sh"]
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge