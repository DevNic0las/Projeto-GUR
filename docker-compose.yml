version: '3.8'
services:
  flask-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: flask
    ports:
      - "5001:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000"]