<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia de Urgência Recife.com.br - GUR.com.br</title>
  <link rel="stylesheet" href="{{url_for('static', filename='bootstrap.min.css')}}">
  <link rel="stylesheet" href="{{url_for('static', filename='hospital.css')}}">
</head>

<body>

  <!--Inicio do Banner da Página Inicial-->
  <div class="banner">
    <div class="container-fluid">
      <div class="navbar navbar-expand-lg navbar-light ">
        <div class="logo">
          <img src="img/logo.jpeg" alt="GUR">
        </div>
         
        <!-- Botão do Menu Hambúrguer -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarMenu"
          aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>


        <!-- Menu de Navegação -->
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">INÍCIO</a></li>
            <li class="nav-item"><a class="nav-link" href="#servicos">SERVIÇOS</a></li>
            <li class="nav-item"><a class="nav-link" href="#locais">LOCAIS</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row">
    <div class="coluna-1">
      <h2>{{hospital_list['name']}}</h2>
      <p>{{hospital_list['description']}}</p>
      <br>
    </div>
    <div class="coluna-2">
      <img src="{{ url_for('static', filename='imgs/' + hospital_list['image'].split('/')[-1]) }}" alt="{{ hospital_list['name'] }}">
      <a href="{{ hospital_list['location'] }}"  class="btn">Abrir Mapa &#8594;</a>
    </div>
  </div>
  </div>
 
  <footer class="rodape">

    <div class="container">
      <div class="row">

        <div class="rodape-col-1">
          <h3>Baixe o nosso app</h3>
          <p>Baixe o nosso aplicativo nas melhores plataformas.</p>
          <div class="app-logo">
            <img src="img/play.png" alt="">
            <img src="img/apple.png" alt="">
          </div>
        </div>

        <div class="rodape-col-2">
          <img src="img/logo.jpeg" alt="GUR">
        </div>

        <div class="rodape-col-3">
          <h3>Mais Informações</h3>
          <ul>
            <li style="cursor: pointer;">Política de Privacidade</li>
            <li style="cursor: pointer;">Contatos</li>
          </ul>
        </div>

      </div>
      <hr>
      <p class="direitos">
        &#169; Todos os Direitos Reservados.
      </p>

    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>

</html>
